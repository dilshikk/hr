[project]
name = "mado-hr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.29,<4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["backend*", "bot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
